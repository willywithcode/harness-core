name: Release

# Triggered by pushing a tag like v0.2.0. That tag is the single source of
# truth for the released core version: the build step below stamps it into
# the binary via -ldflags, so `mustang self-update` always compares
# against the exact string GitHub published as the release tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    # Every platform a binary is published for: the Windows self-update bug
    # (a running .exe cannot be overwritten) passed a Linux-only test job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Newer macOS rejects binaries from older Go linkers (dyld: missing
          # LC_UUID); build and test with the current stable Go. go.mod keeps
          # 1.22 as the minimum.
          go-version: "stable"

      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Newer macOS rejects binaries from older Go linkers (dyld: missing
          # LC_UUID); build and test with the current stable Go. go.mod keeps
          # 1.22 as the minimum.
          go-version: "stable"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          name="mustang-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags "-s -w -X main.coreVersion=${version}" -o "dist/${name}" .
          shasum -a 256 "dist/${name}" | awk '{print $1}' > "dist/${name}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mustang-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
